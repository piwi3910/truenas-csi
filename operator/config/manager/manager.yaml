apiVersion: v1
kind: Namespace
metadata:
  name: truenas-csi-operator-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-csi-operator
  namespace: truenas-csi-operator-system
  labels:
    app.kubernetes.io/name: truenas-csi-operator
    app.kubernetes.io/component: manager
spec:
  # Two replicas with leader election: the standby takes over without a gap, and
  # only the leader ever applies anything.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-csi-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-csi-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: truenas-csi-operator
      # The operator talks only to the Kubernetes API and to the driver's own
      # metrics endpoint. It touches no host state, holds no credential of its
      # own, and never opens a connection to a TrueNAS appliance.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/piwi3910/truenas-csi-operator:0.1.0
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
      terminationGracePeriodSeconds: 10
