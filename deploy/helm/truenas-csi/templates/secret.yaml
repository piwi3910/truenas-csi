{{- /*
The whole driver configuration, including every API key, lives in this Secret
and reaches the plugins only as a mounted file. It is never passed as a
container argument (visible in `ps` and in the pod spec to anyone with pod read
access) and never as a plaintext environment variable.

Set `existingSecret` to manage the same file out of band — from an external
secret store, say — and this template renders nothing.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truenas-csi.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    logLevel: {{ .Values.logLevel | quote }}
    metricsAddr: {{ .Values.metricsAddr | quote }}
    metricsInterval: {{ .Values.metricsInterval | quote }}
    backends:
      {{- range $key, $backend := .Values.backends }}
      {{ $key }}:
        name: {{ default $key $backend.name | quote }}
        flavour: {{ default "scale" $backend.flavour | quote }}
        endpoint: {{ required (printf "backends.%s.endpoint is required and must be wss:// (scale) or https:// (core)" $key) $backend.endpoint | quote }}
        username: {{ required (printf "backends.%s.username is required" $key) $backend.username | quote }}
        apiKey: {{ required (printf "backends.%s.apiKey is required" $key) $backend.apiKey | quote }}
        pool: {{ required (printf "backends.%s.pool is required" $key) $backend.pool | quote }}
        parentDataset: {{ required (printf "backends.%s.parentDataset is required" $key) $backend.parentDataset | quote }}
        insecureSkipVerify: {{ $backend.insecureSkipVerify | default false }}
        reservedBytes: {{ $backend.reservedBytes | default 0 }}
        reservedPercent: {{ $backend.reservedPercent | default 0 }}
        rateLimit: {{ $backend.rateLimit | default 0 }}
        breakerThreshold: {{ $backend.breakerThreshold | default 0 }}
        breakerResetTimeout: {{ $backend.breakerResetTimeout | default "" | quote }}
        {{- with $backend.namespaceQuotas }}
        namespaceQuotas:
          enabled: {{ .enabled | default false }}
          defaultBytes: {{ .defaultBytes | default 0 }}
          {{- with .perNamespace }}
          perNamespace:
            {{- range $ns, $bytes := . }}
            {{ $ns }}: {{ $bytes }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- with $backend.deleteProtection }}
        deleteProtection:
          enabled: {{ .enabled | default false }}
          gracePeriod: {{ .gracePeriod | default "" | quote }}
          graveyardDataset: {{ .graveyardDataset | default "" | quote }}
          reapInterval: {{ .reapInterval | default "" | quote }}
        {{- end }}
        {{- with $backend.caCert }}
        caCert: |
          {{- . | nindent 10 }}
        {{- end }}
      {{- end }}
{{- end }}
