apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenas-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "truenas-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take both replicas down at once: a rolling upgrade must not stop
      # provisioning.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "truenas-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.controller.restartOnConfigChange }}
        # Roll the controller when the configuration changes.
        #
        # The driver hot-reloads a rotated CREDENTIAL on its own and does not
        # need this; what it cannot swap in place is identity — endpoint, pool,
        # parent dataset — and a helm upgrade that changes one of those would
        # otherwise be refused at runtime and quietly ignored. Set
        # controller.restartOnConfigChange=false if you rotate keys through this
        # chart and would rather not restart the controller to do it.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- /* The logging ConfigMap is deliberately NOT checksummed: the whole
        point is that a log level changes without a rollout. */}}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "truenas-csi.controllerServiceAccountName" . }}
      {{- include "truenas-csi.imagePullSecrets" . | indent 6 }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # The controller only ever talks to the appliance over the network; it
      # touches no host state at all.
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: truenas-csi
          image: {{ include "truenas-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -mode=controller
            - -endpoint=$(CSI_ENDPOINT)
            # Credentials come from the mounted Secret, never from an argument.
            - -config=/etc/truenas-csi/config.yaml
            {{- if .Values.dynamicLogging.enabled }}
            # Log level and format, re-read live from a mounted ConfigMap.
            - -log-config=/etc/truenas-csi-logging/logging.yaml
            {{- end }}
            {{- if .Values.controller.metricsLeaderElection }}
            # Naming a Lease here elects the ONE replica that polls the
            # appliance for array metrics. This is not the sidecars' election:
            # they elect a writer, this elects the single replica allowed to
            # spend the appliance's 20-call concurrency budget on polling. A
            # non-leader exports no array metrics at all, which is the honest
            # answer — see the driver's startArrayMetrics.
            - -metrics-lease={{ include "truenas-csi.metricsLeaseName" . }}
            {{- end }}
            {{- if .Values.podmon.enabled }}
            # The ValidateVolumeHostConnectivity extension. Not CSI: a driver
            # extension on a listener of its own, so a stalled driver cannot
            # take the health answer down with it.
            - -podmon-addr={{ .Values.podmon.bindAddress }}:{{ .Values.podmon.port }}
            {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The array-metrics lease identity. A pod name is unique in the
            # namespace at any instant, so a lease held by a dead replica names
            # a pod an operator can actually look up.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 9090
            - name: healthz
              containerPort: 9808
            {{- if .Values.podmon.enabled }}
            - name: podmon
              containerPort: {{ .Values.podmon.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: config
              mountPath: /etc/truenas-csi
              readOnly: true
            {{- if .Values.dynamicLogging.enabled }}
            - name: logging
              mountPath: /etc/truenas-csi-logging
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election={{ .Values.controller.leaderElection }}
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=90s
            - --retry-interval-max=30s
            - --default-fstype=ext4
            # podInfoOnMount and storageCapacity are both on; the provisioner
            # maintains the CSIStorageCapacity objects.
            - --enable-capacity
            - --capacity-ownerref-level=2
            - --feature-gates=Topology=true
            - --extra-create-metadata
            {{- with .Values.sidecars.provisioner.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADDRESS
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # csi-provisioner reads NAMESPACE, not POD_NAMESPACE, when it owns
            # CSIStorageCapacity objects; without it the sidecar exits at start.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.sidecarResources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election={{ .Values.controller.leaderElection }}
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=90s
            {{- with .Values.sidecars.attacher.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADDRESS
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.sidecarResources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election={{ .Values.controller.leaderElection }}
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=90s
            # ZFS refuses to shrink a dataset, so a failed expansion must not be
            # retried into a shrink.
            - --handle-volume-inuse-error=false
            {{- with .Values.sidecars.resizer.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADDRESS
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.sidecarResources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        {{- if .Values.snapshotter.enabled }}
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election={{ .Values.controller.leaderElection }}
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --timeout=90s
            - --extra-create-metadata
            {{- with .Values.sidecars.snapshotter.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADDRESS
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.sidecarResources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        {{- end }}
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessprobe.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --csi-address=$(ADDRESS)
            - --health-port=9808
            {{- with .Values.sidecars.livenessprobe.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADDRESS
              value: unix:///csi/csi.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.controller.sidecarResources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        # The controller's CSI socket is pod-local: nothing outside the pod
        # needs to reach it.
        - name: socket-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          secret:
            secretName: {{ include "truenas-csi.secretName" . }}
            defaultMode: 0440
        {{- if .Values.dynamicLogging.enabled }}
        # A ConfigMap volume, so the kubelet keeps the mounted copy in step with
        # the object. The driver watches the directory, because a projected
        # update swaps a symlinked "..data" directory rather than writing the
        # file, and a watch on the file itself would never see it.
        - name: logging
          configMap:
            name: {{ include "truenas-csi.loggingConfigMapName" . }}
            defaultMode: 0444
        {{- end }}
