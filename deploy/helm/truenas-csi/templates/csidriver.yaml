apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Immutable, and deliberately not derived from the release name: this string
  # is written into every PersistentVolume the driver creates.
  name: {{ include "truenas-csi.driverName" . }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
spec:
  # An iSCSI LUN must be attached before a pod can use it, and the attachment is
  # the controller's business, not the kubelet's.
  #
  # This field is IMMUTABLE. Changing it in values.yaml is not enough: the
  # CSIDriver object has to be deleted and recreated. See the upgrade note in
  # values.yaml and the "Upgrading to the fenced attach model" section of
  # README.md.
  attachRequired: {{ .Values.csidriver.attachRequired }}
  # Pod metadata reaches NodePublishVolume, which is what makes per-workload
  # diagnostics possible.
  podInfoOnMount: {{ .Values.csidriver.podInfoOnMount }}
  # The scheduler consults CSIStorageCapacity so a pod is not placed on a
  # topology whose pool is full.
  storageCapacity: {{ .Values.csidriver.storageCapacity }}
  # File: apply fsGroup only when the volume's access mode allows it. Chowning
  # a shared NFS export recursively on every mount would be both slow and wrong.
  fsGroupPolicy: {{ .Values.csidriver.fsGroupPolicy }}
  # Persistent only, deliberately.
  #
  # An Ephemeral (CSI inline) volume is provisioned inside NodePublishVolume,
  # with no CreateVolume and no ControllerPublishVolume at all. This driver's
  # safety properties all live in the controller: the reserve check that keeps
  # PVCs from filling the pool, the publish ledger that makes a single-writer
  # volume enforceable, and above all the FENCE — ControllerUnpublishVolume is
  # what revokes a node's appliance-side access, and it is never called for a
  # volume the controller never published. An inline volume on a node that has
  # stopped answering would be unfenceable by construction.
  #
  # It would also need the node plugin to hold appliance credentials in order
  # to create datasets and shares, which is exactly the privilege split this
  # deployment keeps: only the controller talks to the middleware.
  #
  # If a workload wants scratch space that dies with the pod, an emptyDir or a
  # generic ephemeral volume (a normal PVC with the pod's lifetime) gets that
  # through the controller, with every check above still applied.
  volumeLifecycleModes:
    - Persistent
