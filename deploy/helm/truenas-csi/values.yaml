# Default values for truenas-csi.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/piwi3910/truenas-csi
  # tag defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Driver-level settings. These end up in the mounted config Secret, not in
# container arguments, so nothing here can leak through `ps` or a pod spec.
logLevel: info
# logFormat is text or json. It only takes effect through the logging ConfigMap
# below; the startup format is text.
logFormat: text
metricsAddr: ":9090"
healthAddr: ":9808"

# dynamicLogging mounts logLevel and logFormat as a ConfigMap that the driver
# re-reads live, so verbosity can be raised during an incident without a
# rollout — `kubectl edit configmap`, and every replica picks it up in seconds.
#
# It is deliberately a ConfigMap and not the credential Secret: whoever is
# handling the incident needs the log level, not the API key. Nothing else is
# reloadable this way; see `credential hot-reload` below for what is.
dynamicLogging:
  enabled: true
  # existingConfigMap names a ConfigMap you manage yourself, holding key
  # `logging.yaml` with logLevel and logFormat. When set, the chart renders no
  # ConfigMap of its own.
  existingConfigMap: ""

# How often the controller polls each appliance for array-level metrics (pool,
# dataset and iSCSI figures). Polling never happens on the Prometheus scrape
# path, so this bounds staleness only, never scrape latency.
metricsInterval: "60s"

# metrics wires the driver's Prometheus output into a monitoring stack.
#
# WHERE THE PER-VOLUME NUMBERS COME FROM. Dell's CSM polls the array for
# per-volume IOPS, bandwidth and latency. TrueNAS publishes no per-dataset or
# per-zvol series at all — verified against the appliance, `reporting` exposes
# 40 graphs and every one of them is appliance-wide or per physical disk — so
# this driver measures on the NODE instead, from /proc/diskstats (iSCSI, NVMe)
# and /proc/self/mountstats (NFS, SMB). That costs the appliance NOTHING, where
# an array-polling design spends its small concurrency budget every 10-20s.
#
# The two limitations are honest and worth reading before building an alert on
# these series:
#
#   1. only MOUNTED volumes are visible. A volume that is attached but not
#      mounted, or bound but unused, reports nothing at all.
#   2. a volume's series MOVES between node exporters when its pod reschedules.
#      The counters restart from the new node's kernel, so the move looks like a
#      counter reset on a new series. Use sum(rate(...)), never rate(sum(...)).
#
# See docs/metrics.md for the full metric list.
metrics:
  # podMonitor creates PodMonitors for the node and controller pods. It needs
  # the Prometheus Operator CRDs; leave it off and scrape by pod annotation if
  # you run Prometheus without the operator.
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # labels the Prometheus instance selects PodMonitors by, e.g.
    # release: kube-prometheus-stack.
    labels: {}
  # dashboards ships the Grafana dashboard as a ConfigMap for the Grafana
  # sidecar to import. The label is the sidecar's, so it is configurable: the
  # kube-prometheus-stack default is grafana_dashboard: "1".
  dashboards:
    enabled: false
    # namespace defaults to the release namespace; set it when Grafana's
    # sidecar only watches its own.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    annotations: {}

# backends maps a StorageClass `backend` parameter to one TrueNAS appliance.
# Every field mirrors internal/config.Backend. The whole map is rendered into a
# Secret and mounted at /etc/truenas-csi/config.yaml — credentials never appear
# in a container argument or a plaintext environment variable.
#
# backends:
#   nas1:
#     # name defaults to the map key when omitted.
#     name: nas1
#     # "scale" (default, JSON-RPC websocket) or "core" (legacy REST v2).
#     # CORE support is UNVERIFIED against real CORE hardware — see the README.
#     flavour: scale
#     # Must be wss:// for scale, https:// for core. TrueNAS revokes an API key
#     # presented over plaintext, so the scheme is enforced at startup.
#     endpoint: wss://nas1.example.com/api/current
#     username: csi
#     apiKey: "1-abcdef..."
#     pool: tank
#     parentDataset: tank/k8s
#     # PEM bundle trusted for this appliance. The stock TrueNAS certificate is
#     # self-signed with SAN=DNS:localhost and cannot be verified against a real
#     # address, so either supply your own certificate here or accept the risk
#     # below.
#     caCert: ""
#     insecureSkipVerify: false
#     # Pool headroom the driver never hands out, so PVCs cannot fill the pool
#     # and starve TrueNAS itself. Both are optional; when both are set the
#     # LARGER reservation wins. reservedPercent is a share of the pool size.
#     reservedBytes: 53687091200 # 50 GiB
#     reservedPercent: 10
#     # Middleware calls per second this driver will make to the appliance.
#     # 0 uses the driver's default of 100/s, which is a ceiling on a runaway
#     # caller rather than a throughput target — a healthy driver never reaches
#     # it. The appliance's real constraint is CONCURRENCY (20 in flight,
#     # measured), and the client caps itself at 16 regardless of this.
#     rateLimit: 0
#     # Consecutive TRANSPORT failures that open the circuit breaker. 0 uses the
#     # driver's default of 10; a negative value disables the breaker. Method
#     # errors do not count — a middleware answering "dataset not found" is a
#     # healthy appliance. 10 is deliberately above the 16 calls a single
#     # dropped websocket can fail at once, so a routine reconnect never opens
#     # it.
#     breakerThreshold: 0
#     # How long the breaker stays open before letting a single probe through.
#     # Empty uses the driver's default of 10s, chosen to be shorter than the
#     # CSI sidecars' 30s retry ceiling so a recovered appliance is picked up
#     # within one sidecar retry.
#     breakerResetTimeout: ""
#     # Per-namespace capacity accounting. OFF by default, and enabling it
#     # changes the dataset layout of every volume created afterwards: a volume
#     # goes to <pool>/<parentDataset>/<namespace>/<pv-name> instead of
#     # <pool>/<parentDataset>/<pv-name>, and the namespace dataset carries a
#     # ZFS quota that the appliance itself enforces.
#     #
#     # READ BEFORE ENABLING:
#     #  * Volumes provisioned BEFORE you enable it stay where they are and are
#     #    NOT counted against any namespace quota. Their handles are immutable,
#     #    so nothing can move them. Migrate them (new PVC, copy, delete) if you
#     #    need them counted.
#     #  * Disabling it again is safe for existing volumes — their handles keep
#     #    resolving — but new volumes go back to the flat layout and stop being
#     #    counted.
#     #  * The driver must be restarted for a change here to take effect; the
#     #    hot-reload path refuses it (see controller.restartOnConfigChange).
#     #  * A volume group snapshot cannot span namespaces: the atomic recursive
#     #    snapshot needs one common parent dataset.
#     #  * The scheduler is still told POOL capacity, not namespace capacity —
#     #    a PVC over its namespace quota binds and then fails provisioning with
#     #    ResourceExhausted rather than staying Pending. See docs/capacity.md.
#     namespaceQuotas:
#       enabled: false
#       # Quota in bytes for a namespace with no entry below. 0 is unlimited:
#       # the namespace still gets its own dataset and its own `zfs used`
#       # figure, but no ceiling.
#       defaultBytes: 107374182400 # 100 GiB
#       # Per-namespace overrides. Keys must be real DNS-1123 namespace names;
#       # a typo is refused at startup rather than silently granting the
#       # default forever. 0 is an explicit "unlimited".
#       perNamespace:
#         team-a: 536870912000 # 500 GiB
#         kube-system: 0
#     # Delete protection: a grace period between `kubectl delete pvc` and the
#     # destruction of the data. OFF by default, because turning it on changes
#     # what deleting a PVC means.
#     #
#     # When it is on, DeleteVolume tears down the volume's shares, extents and
#     # target mappings exactly as before, then RENAMES the dataset into
#     # <pool>/<parentDataset>/<graveyardDataset>/ instead of destroying it,
#     # stamping it with when it was deleted and which volume it was. A reaper
#     # inside the controller destroys graveyard datasets once their grace
#     # period has expired.
#     #
#     # READ BEFORE ENABLING — CAPACITY IS NOT RECLAIMED DURING THE GRACE
#     # PERIOD. Deleting ten PVCs to free space leaves the pool exactly as full
#     # as it was for the whole gracePeriod. That space keeps counting against
#     # reservedBytes/reservedPercent and against the capacity reported to the
#     # scheduler, because it is genuinely still allocated. This is the trade
#     # the feature IS, not a bug. Size the graveyard into your pool headroom,
#     # and watch truenas_dataset_used for the graveyard's datasets.
#     #
#     # Also true:
#     #  * Per-namespace accounting is the one exception: a retired volume
#     #    leaves its namespace dataset, so the namespace's `zfs used` drops
#     #    immediately even though the pool's does not.
#     #  * A retired volume's snapshots travel with it and are destroyed with it
#     #    at the end of the grace period, exactly as they are destroyed with
#     #    the volume today.
#     #  * A retired volume that a live volume was CLONED from cannot be
#     #    destroyed by ZFS. The reaper leaves it and retries; it never promotes
#     #    the live clone, because that would make the live volume depend on a
#     #    dataset queued for destruction.
#     #  * Turning this off again leaves whatever is already in the graveyard.
#     #    The reaper only runs while it is on, so remove the leftovers by hand.
#     #  * The driver must be restarted for a change here to take effect; the
#     #    hot-reload path refuses it (see controller.restartOnConfigChange).
#     #  * Not available on flavour "core": it renames datasets, and the CORE
#     #    REST mapping for pool.dataset.rename is unverified. Enabling it there
#     #    is refused at startup.
#     deleteProtection:
#       enabled: false
#       # How long a deleted volume is kept before the reaper may destroy it, as
#       # a Go duration. A zero or absent value is the same as enabled: false.
#       gracePeriod: 168h # one week
#       # The dataset retired volumes are moved into, relative to parentDataset.
#       # Defaults to ".trash". The leading dot is legal in a ZFS dataset name
#       # (only "." and ".." are refused) and is what makes a collision with a
#       # namespace or a PersistentVolume name impossible, since neither may
#       # begin with one.
#       graveyardDataset: ".trash"
#       # How often the controller looks for expired graveyard datasets.
#       # Defaults to 1h. It only bounds how long past its grace period a
#       # dataset survives; it never decides whether one may be destroyed.
#       reapInterval: 1h
backends: {}

# Credential hot-reload
#
# The driver watches the mounted config Secret and adopts a rotated credential
# — username, apiKey, caCert, insecureSkipVerify — without restarting: it
# revalidates the whole file (including the wss://-only transport check),
# refuses the change if anything else differs, and reconnects each appliance
# with the new key.
#
# These fields require a RESTART and are refused at runtime, loudly:
#   endpoint, flavour, pool, parentDataset, the set of backend names,
#   reservedBytes, reservedPercent, namespaceQuotas, deleteProtection,
#   rateLimit, breaker settings, metricsAddr, healthAddr, metricsInterval.
#
# They are identity or startup wiring: every PersistentVolume records which
# appliance and dataset it lives on, so swapping one in place would silently
# repoint live volumes at a different array. controller.restartOnConfigChange
# (below) is what makes a helm upgrade of those fields take effect.

# existingSecret names a Secret you manage yourself holding key `config.yaml`.
# When set, the chart renders no Secret of its own and `backends` is ignored,
# so credentials can live in an external secret store instead of in values.
existingSecret: ""

controller:
  replicas: 2
  # Leader election makes the second replica a warm standby rather than a
  # second writer. This is the CSI SIDECARS' election.
  leaderElection: true
  # metricsLeaderElection elects one replica to poll the appliance for array
  # metrics. It is a separate lease from the sidecars' on purpose: they elect a
  # writer, this elects the single replica allowed to spend the appliance's
  # 20-call concurrency budget on polling. Without it every replica polls.
  #
  # A non-leader exports no truenas_pool_*, truenas_dataset_* or
  # truenas_iscsi_* series at all — exporting zeros would read as a pool that
  # suddenly emptied, and exporting stale values would be a gauge that quietly
  # stopped tracking reality. Scrape all replicas; only one answers.
  metricsLeaderElection: true
  # restartOnConfigChange rolls the controller when the config Secret changes.
  #
  # Credential rotation no longer needs it — the driver hot-reloads a rotated
  # key in place. What it still covers is a helm upgrade that changes endpoint,
  # pool or parentDataset, which the driver refuses to swap at runtime and
  # would otherwise ignore until somebody noticed the log line. Turn it off if
  # you rotate keys through this chart and would rather not restart to do it.
  restartOnConfigChange: true
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity: {}
  priorityClassName: ""
  # Spread the replicas so a single node failure cannot take both.
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  sidecarResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

node:
  # kubeletDir is the kubelet root. k3s and microk8s do not use the default.
  kubeletDir: /var/lib/kubelet
  # Host paths shared with the rest of the node's storage stack. Longhorn owns
  # the same iSCSI state, so these are read and written cooperatively; see
  # docs/security.md.
  hostPaths:
    etcISCSI: /etc/iscsi
    varISCSI: /var/lib/iscsi
    dev: /dev
    modules: /lib/modules
    systemdRun: /run/systemd
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  # Run on every node, including control-plane and cordoned nodes: a node
  # without the plugin cannot mount any volume at all.
  tolerations:
    - operator: Exists
  priorityClassName: ""
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  sidecarResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# volumeSnapshotClass creates the VolumeSnapshotClass that routes `kubectl`
# snapshots to this driver. It needs the external-snapshotter CRDs to exist
# first, so it is off by default like the sidecar that consumes them.
volumeSnapshotClass:
  enabled: false
  name: ""
  isDefault: false
  # Delete removes the ZFS snapshot when the VolumeSnapshot goes away. Set
  # Retain to keep it, at the cost of manual cleanup.
  deletionPolicy: Delete
  parameters: {}

snapshotter:
  # enabled deploys the csi-snapshotter sidecar and its RBAC. Requires the
  # snapshot CRDs and the cluster-wide snapshot controller to already exist.
  enabled: true
  # install is deliberately false and should stay false.
  #
  # The VolumeSnapshot CRDs and the snapshot controller are a cluster-wide
  # singleton owned by the cluster, not by any one CSI driver. Two drivers
  # installing them fight over the CRD version and break snapshots for both.
  # Install external-snapshotter once, cluster-wide, before enabling snapshots
  # here.
  install: false

csidriver:
  # The driver grants and revokes appliance-side access per node:
  # ControllerPublishVolume creates the iSCSI LUN mapping / NVMe port binding or
  # adds the node to the NFS/SMB host list, and ControllerUnpublishVolume takes
  # it away. That revoke is the FENCE a stuck node is removed with, and the CO
  # only ever calls it for a driver that declares an attach step.
  #
  # UPGRADING FROM A RELEASE THAT HAD THIS false: spec.attachRequired is
  # IMMUTABLE. Helm cannot change it in place; the upgrade fails, or silently
  # leaves the old value. The CSIDriver object must be deleted and recreated:
  #
  #   kubectl delete csidriver csi.truenas.watteel.com
  #   helm upgrade truenas-csi deploy/helm/truenas-csi -n truenas-csi
  #
  # During that window: volumes that are already mounted keep working — the
  # mount is a node-side fact and nothing in this change touches it — and reads
  # and writes continue uninterrupted. What does NOT work is anything that needs
  # a new attachment: a pod starting, rescheduling, or a new PVC being bound.
  # Those retry, so they recover on their own once the object is back.
  #
  # After the upgrade, the first ControllerPublishVolume of each existing volume
  # adopts the mapping it already has rather than making a second one, so no
  # running workload has to be restarted to migrate it.
  attachRequired: true
  # There is no `ephemeral` switch here on purpose. CSI inline (Ephemeral)
  # volumes are provisioned in NodePublishVolume with no controller involvement,
  # so they would bypass the pool reserve, the publish ledger and — the reason
  # it is not a tunable — the fence, which lives in ControllerUnpublishVolume
  # and is never called for a volume the controller never published. The
  # reasoning is spelled out in templates/csidriver.yaml; use a generic
  # ephemeral volume (a PVC with the pod's lifetime) instead.
  podInfoOnMount: true
  storageCapacity: true
  fsGroupPolicy: File

rbac:
  create: true

serviceAccounts:
  controller:
    create: true
    name: ""
    annotations: {}
  node:
    create: true
    name: ""
    annotations: {}

# Optional example StorageClasses. Both are off by default: the right pool,
# dataset and network for a cluster are site-specific.
storageClasses:
  nfs:
    enabled: false
    name: truenas-nfs
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
      - hard
    parameters:
      backend: nas1
      protocol: nfs
      pool: tank
      parentDataset: tank/k8s
      # NFSv4 is preferred: NFSv3 locking is stateless and interacts badly with
      # pod rescheduling.
      nfsVersion: "4"
      # Comma-separated CIDRs allowed to mount the export.
      networks: 10.0.0.0/8
      # A fresh dataset is root:root 0755, so a non-root pod cannot write to it
      # unless the driver sets ownership at provision time.
      mode: "0770"
      uid: "0"
      gid: "0"
  iscsi:
    enabled: false
    name: truenas-iscsi
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    parameters:
      backend: nas1
      protocol: iscsi
      pool: tank
      parentDataset: tank/k8s
      fsType: ext4
      sparse: "true"
      # portalID reuses an existing portal instead of letting the driver create
      # one. Leave empty to have the driver manage the portal.
      portalID: ""
      # CHAP is on by default; the driver generates the credentials and stores
      # them on TrueNAS.
      chap: "true"
      # initiatorACL restricts the shared target to the cluster's node IQNs.
      # Turning it off exposes every LUN on the target to any initiator that can
      # reach the portal.
      initiatorACL: "true"
      # Multipath degrades to single path with a warning when the node lacks
      # multipath-tools.
      multipath: "false"

# podmon exposes the driver's connectivity answers on a listener of its own,
# alongside the CSI socket. It is a DRIVER EXTENSION, NOT CSI: the CSI
# specification defines no such call.
#
# The two ends answer DIFFERENT questions, and the difference matters:
#
#   On the CONTROLLER — the appliance-backed report, and the only answer a
#   fencing decision may use. It asks the APPLIANCE whether a node still holds
#   an iSCSI session or is renewing an NFS lease, so it still works when the
#   node itself is gone:
#
#     POST /podmon/v1/connectivity   (on <bindAddress>:<port>)
#     {"nodeId": "worker-21", "volumeIds": ["nas1/nfs/tank/k8s/pvc-a"]}
#
#   On the NODE — a self-diagnosis: "can I still reach the appliance and my own
#   mounts?" It runs its own bounded probes on its own timers and shares nothing
#   with the driver's middleware client, so it keeps answering when the driver
#   has stalled on a hung mount. It is NOT a fencing input; a node that has
#   stopped answering cannot report that it has stopped answering:
#
#     POST /podmon/v1/node-self-check   (on <bindAddress>:<port>)
#
# Off by default: it opens an extra listener, and that is an operator's
# decision. bindAddress stays on the loopback address unless you deliberately
# expose it — the node DaemonSet runs with hostNetwork, so 0.0.0.0 here means
# every pod and every host on the node's network can query it.
podmon:
  enabled: false
  port: 9820
  bindAddress: "127.0.0.1"

# fencing force-deletes a pod stuck on a failed node, but only after the
# APPLIANCE has confirmed that the node can no longer reach the pod's volumes.
#
# OFF BY DEFAULT, AND OPT-IN PER POD. This is the one feature of this driver
# that destroys a running workload's pod, so it needs two separate decisions: an
# operator enabling it here, and a workload owner labelling the pods that may be
# fenced. A pod without the label is never touched.
#
# What it does, in this order — the order is the safety property:
#
#   1. the pod is not ready and its node carries the unreachable/not-ready
#      NoExecute taint (a cordoned or drained node is maintenance, not failure);
#   2. the pod's UID is re-read, so a pod recreated under the same name is never
#      the one killed;
#   3. the appliance is asked. Still connected, a fresh NFS lease, anything
#      unknown, or ANY error aborts the whole thing with a Warning event;
#   4. appliance access is revoked for every volume the pod holds. If any single
#      revoke fails, nothing is deleted;
#   5. only then: taint the node, delete the VolumeAttachments, force-delete the
#      pod.
#
# What it will NOT fence, because the appliance cannot answer for it:
#   - SMB volumes: this appliance publishes no SMB session or status call;
#   - NVMe-oF volumes: nvmet.global.sessions exists on the appliance but is not
#     yet wired into this driver.
# Those abort with an event saying so, rather than being fenced on a guess.
#
# RWX: fencing is per node. Revoking removes only the failed node's addresses
# from the share's host list, so other healthy pods on other nodes keep using
# the same ReadWriteMany volume, and their sessions never veto the fence.
#
# Enabling this renders three extra RBAC grants (pods: delete, nodes: patch,
# volumeattachments: delete) which the default install does not have.
fencing:
  enabled: false
  # podLabel is the opt-in label, key=value. Only pods carrying it are eligible.
  podLabel: "csi.truenas.watteel.com/fence=true"
  # interval is the sweep period. Node failure is signalled on a timescale of
  # tens of seconds, so there is nothing to gain from sweeping faster.
  interval: "15s"

# Sidecar images, pinned by digest-bearing tag. Change these only together with
# a documented compatibility check against the Kubernetes minimum (1.31).
sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    extraArgs: []
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.7.0
    extraArgs: []
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    extraArgs: []
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.1.0
    extraArgs: []
  livenessprobe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
    extraArgs: []
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
    extraArgs: []
