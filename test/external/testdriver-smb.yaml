# Upstream Kubernetes external-storage test driver definition — SMB.
#
# This ran as a placeholder for a protocol that had no node data path. That
# stopped being true when internal/node/cifs.go landed: internal/node/node.go
# declares ProtocolSMB, internal/node/preflight.go probes CapSMB, and a node
# with mount.cifs publishes the csi.truenas.watteel.com/smb topology label that
# requiredTopology() asks for. The definition is now run like the others.
#
# It needs credentials the other protocols do not: an SMB user on the appliance
# and a Kubernetes Secret holding it, named by the StorageClass's secretName and
# secretNamespace parameters. See docs/security.md and test/external/README.md.

StorageClass:
  FromExistingClassName: __STORAGE_CLASS__
SnapshotClass:
  FromExistingClassName: __SNAPSHOT_CLASS__

DriverInfo:
  Name: csi.truenas.watteel.com

  SupportedSizeRange:
    Min: 1Gi

  # Like NFS, the appliance owns the filesystem; the cifs client never formats.
  SupportedFsType:
    "": {}

  SupportedMountOption:
    noserverino: {}

  # EVERY key the node plugin publishes, not just this protocol's.
  #
  # NodeGetInfo reports one segment per capability the node was probed for, so a
  # CSIStorageCapacity object's NodeTopology carries all of them. Declaring only
  # the protocol's key made the capacity suite look for an object keyed on that
  # one alone, find none, and fail a driver that was behaving correctly --
  # declaring the real set turns the same run green.
  #
  # The backend key is rendered by run.sh from the StorageClass's own `backend`
  # parameter, because it is named after the operator's backend and cannot be
  # checked in.
  TopologyKeys:
    - csi.truenas.watteel.com/nfs
    - csi.truenas.watteel.com/iscsi
    - csi.truenas.watteel.com/nvme
    - csi.truenas.watteel.com/smb
    - csi.truenas.watteel.com/ext4
    - csi.truenas.watteel.com/xfs
    - csi.truenas.watteel.com/multipath
    - __BACKEND_TOPOLOGY_KEY__
  NumAllowedTopologies: 1

  Capabilities:
    persistence: true

    # A share is not a block device.
    block: false

    exec: true

    # SMB ownership is a MOUNT-TIME concern handled by the cifs client's
    # uid/gid/file_mode/dir_mode options, which the backend publishes for the
    # node to apply. kubelet's fsGroup chown is neither used nor meaningful.
    fsGroup: false
    volumeMountGroup: false

    # ZFS snapshot and clone, identical to the NFS backend's.
    snapshotDataSource: true
    pvcDataSource: true

    multipods: true

    # JUDGEMENT CALL, and a KNOWN MISMATCH. An SMB share genuinely serves many
    # nodes at once, so RWX is the truthful value for the storage. But
    # supportsAccessMode() in internal/csi/controller.go special-cases only
    # "nfs" and drops SMB into the default branch, which refuses every
    # MULTI_NODE_* mode. This flag is set to the storage's real capability so
    # the suite fails loudly on that bug rather than encoding it as fact; the
    # fix belongs in the controller, not here. See README.md.
    RWX: true

    readWriteOncePod: true

    # refquota change, same as NFS. NodeExpandVolume would be a no-op.
    controllerExpansion: true
    nodeExpansion: true
    onlineExpansion: true
    offlineExpansion: false

    volumeLimits: true
    singleNodeVolume: true
    topology: true
    capacity: true

    multiplePVsSameID: false
