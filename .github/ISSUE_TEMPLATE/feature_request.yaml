name: Feature request
description: Something the driver should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered
