name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true
        type: string

# One release at a time, and never cancelled: a half-pushed manifest list or a
# signature without its image is worse than a queued run.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: piwi3910/truenas-csi
  GO_VERSION: "1.26"

jobs:
  # Gate the release on the same checks CI runs, on the primary architecture.
  # A tag must never publish something that would have failed a pull request.
  verify:
    name: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

  # Each architecture is built on its own native runner and pushed by digest
  # only — no tag is moved until both digests exist and the manifest list is
  # assembled. arm64 is the primary architecture.
  build:
    name: build (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.event.inputs.tag || github.ref_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the manifest list, then sign it and attach the SBOM. The signature
  # and the attestation are made against the manifest-list digest, so verifying
  # the tag verifies both architectures at once.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this OIDC token for a short-lived
      # Fulcio certificate. No private key exists to be stolen.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}

      - name: Create manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # each digest must be a separate argument
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Assert the manifest list covers both architectures
        run: |
          set -euo pipefail
          # --raw prints the index itself, so this reads exactly what a client
          # pulling the tag would resolve against.
          platforms=$(docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown")
                     | .platform.os + "/" + .platform.architecture' \
            | sort -u)
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$want" || { echo "manifest list is missing $want" >&2; exit 1; }
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest list (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the SBOM as an attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}

  # Verify the published artifacts the way a consumer would, from outside the
  # job that made them. A release that cannot be verified is not a release.
  verify-release:
    name: verify-release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release artifact tests
        run: go test -count=1 -v ./test/release/
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.version }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
          # The keyless identity that signed it: this workflow, on this repo.
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yaml@refs/tags/
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

  # The chart is published as an OCI artifact beside the image, so one registry
  # and one set of credentials covers both. It is also served from the Pages
  # site as a classic Helm repo by the docs workflow, because `helm repo add`
  # is still what most instructions assume.
  chart:
    name: chart
    needs: [publish, verify-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      # The chart's version and the image tag are the same release. A chart that
      # says 0.1.0 while pulling :v0.2.0 is the kind of drift nobody notices
      # until a rollback pulls the wrong pair, so it is asserted rather than
      # assumed.
      - name: Assert the chart version matches the tag
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          want="${VERSION#v}"
          chart=$(grep -E '^version:' deploy/helm/truenas-csi/Chart.yaml | awk '{print $2}')
          app=$(grep -E '^appVersion:' deploy/helm/truenas-csi/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "tag=$want chart.version=$chart chart.appVersion=$app"
          [ "$chart" = "$want" ] || { echo "Chart.yaml version $chart != tag $want" >&2; exit 1; }
          [ "$app" = "$want" ] || { echo "Chart.yaml appVersion $app != tag $want" >&2; exit 1; }

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          helm package deploy/helm/truenas-csi --destination dist
          helm push "dist/truenas-csi-${VERSION#v}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Upload the packaged chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  # The GitHub Release is created last, so it never advertises artefacts that a
  # later job might fail to publish.
  github-release:
    name: github-release
    needs: [publish, verify-release, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the packaged chart
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chart
          path: dist

      - name: Compose the release notes
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "helm install truenas-csi oci://ghcr.io/${{ github.repository_owner }}/charts/truenas-csi \\"
            echo "  --version ${VERSION#v} --namespace truenas-csi --create-namespace \\"
            echo "  --set backends.nas1.endpoint=wss://nas.example.com/api/current \\"
            echo "  --set backends.nas1.username=truenas_admin \\"
            echo "  --set backends.nas1.apiKey=... \\"
            echo "  --set backends.nas1.pool=tank --set backends.nas1.parentDataset=tank/k8s"
            echo '```'
            echo
            echo "## Artefacts"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Chart | \`oci://ghcr.io/${{ github.repository_owner }}/charts/truenas-csi:${VERSION#v}\` |"
            echo "| Docs | https://piwi3910.github.io/truenas-csi/ |"
            echo
            echo "The image is signed with cosign (keyless) and carries an SBOM attestation:"
            echo
            echo '```sh'
            echo "cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            if [ -f CHANGELOG.md ]; then
              echo "## Changes"
              echo
              awk '/^## /{ if (seen) exit; seen=1; next } seen' CHANGELOG.md
            fi
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" dist/*.tgz \
            --title "$VERSION" --notes-file notes.md $prerelease
