name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are wasted machine time; a CI run has no side
# effects, so cancelling one is free.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Any job that needs more says so itself.
permissions:
  contents: read

env:
  # Keep this in step with the go directive in go.mod.
  GO_VERSION: "1.27"

jobs:
  # GitHub disables a scheduled workflow after 60 days without repository
  # activity. It emails the owner and the schedule simply stops: nothing fails,
  # nothing is red, and the nightly image quietly goes stale while a test
  # cluster keeps pulling a tag that no longer moves.
  #
  # This runs on PUSH, which is the right trigger for it. The disabling is
  # caused by inactivity, so the first push afterwards is the first moment
  # anybody could act — and until somebody pushes, nothing is being missed.
  #
  # It deliberately does not gate the other jobs: a stale nightly is not a
  # reason to fail somebody's change, but it is a reason to show a red check
  # that says what to do about it.
  nightly-freshness:
    name: nightly freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading another workflow's state and runs.
      actions: read
    steps:
      - name: Check the nightly is still running
        run: |
          set -euo pipefail

          # Two questions, because they fail differently. A workflow can be
          # DISABLED, or active but not actually producing — a nightly broken
          # for a week looks healthy to a state check alone.
          state=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW}" --jq .state)
          echo "workflow state: ${state}"

          if [ "${state}" != "active" ]; then
            {
              echo "### nightly is not running"
              echo
              echo "\`${WORKFLOW}\` is **${state}**, so no nightly image is being published."
              echo
              if [ "${state}" = "disabled_inactivity" ]; then
                echo "GitHub disables scheduled workflows after 60 days without repository"
                echo "activity. Re-enable it with:"
              else
                echo "Re-enable it with:"
              fi
              echo
              echo "    gh workflow enable ${WORKFLOW} --repo ${REPO}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${WORKFLOW} is ${state}; no nightly image is being published"
            exit 1
          fi

          last=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // ""')
          if [ -z "${last}" ]; then
            echo "::notice::${WORKFLOW} has never completed successfully yet"
            exit 0
          fi

          # python3 rather than `date -d`, which is GNU-only: this check has to
          # be runnable outside the runner to see whether it works.
          age=$(python3 -c 'import datetime,sys; print((datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))).days)' "${last}")
          echo "last successful nightly: ${last} (${age}d ago)"

          # Three days, not one: a single missed night is a queued runner or a
          # GitHub incident, and failing on that would train everyone to ignore
          # this check — the one failure mode it cannot survive.
          if [ "${age}" -gt "${MAX_AGE_DAYS}" ]; then
            {
              echo "### nightly is stale"
              echo
              echo "The last successful \`${WORKFLOW}\` run was **${age} days ago** (${last})."
              echo "The workflow is enabled, so it is running and failing, or not being"
              echo "triggered. A cluster following \`:nightly\` is on an old image."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::last successful ${WORKFLOW} was ${age}d ago (limit ${MAX_AGE_DAYS}d)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: nightly.yaml
          MAX_AGE_DAYS: "3"

  # arm64 is the primary architecture (RK3588 / Armbian, k3s 1.34); amd64 is
  # built and tested but is not the validation target. Both run every check,
  # and fail-fast is off so a failure on one architecture never hides the
  # other's result.
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            primary: true
          - arch: amd64
            runner: ubuntu-24.04
            primary: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            echo "$unformatted" | xargs gofmt -d >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      # test/... skips anything needing helm, kind, docker or a live appliance,
      # so this stays green on a runner with none of them.
      - name: Unit and sanity tests
        run: go test -race -count=1 ./...

  lint:
    name: lint (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # Report EVERY finding. The defaults cap output at 50 per linter and 3
          # per repeated issue, which turns one fix-and-rerun cycle into several
          # and makes a large batch look smaller than it is.
          args: --timeout=10m --max-issues-per-linter=0 --max-same-issues=0

  # The chart tests only assert anything when helm is installed, so CI installs
  # it: RBAC minimality and the snapshot-CRD default are exactly the properties
  # that must not regress unnoticed.
  chart:
    name: chart
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint --strict deploy/helm/truenas-csi

      - name: Chart tests
        run: go test -count=1 ./test/chart/

  # The operator is a SEPARATE module in the go.work workspace, so the root
  # `go build ./...` above does not reach it. CI has to enter it explicitly, and
  # with GOWORK=off, because that is what `go install` and a consumer's build
  # actually do -- a workspace can hide a missing require from everyone but the
  # person who has the workspace.
  operator:
    name: operator
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        working-directory: operator
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build, vet and test without the workspace
        working-directory: operator
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      # golangci-lint is MODULE-scoped: the lint job above runs in the
      # repository root and never reaches this module, so without this step the
      # operator is linted by nothing at all. That gap hid six real findings,
      # including a deprecated events API whose replacement needs different
      # RBAC -- the kind of thing that fails silently rather than loudly.
      #
      # GOWORK=off for the same reason the build above uses it: the workspace
      # can resolve an import the module's own go.mod does not require.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: operator
          args: --timeout=10m --max-issues-per-linter=0 --max-same-issues=0
        env:
          GOWORK: "off"

  # Chart testing against a REAL API server. `helm lint` checks the template
  # renders; only a server-side dry run checks that what it rendered is
  # something Kubernetes will accept -- field names, enum values, and the CRDs'
  # own schemas. kind is cheap and catches manifest errors that otherwise
  # surface at install time on a user's cluster.
  chart-install:
    name: chart install (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Create a kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: chart-ct

      # The snapshot CRDs are a cluster prerequisite, not something this chart
      # owns. Installing them here mirrors a real cluster and lets the
      # VolumeSnapshotClass in the chart validate against a real schema.
      - name: Install the snapshot CRDs
        run: |
          base=https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.1.0/client/config/crd
          for crd in snapshot.storage.k8s.io_volumesnapshotclasses.yaml \
                     snapshot.storage.k8s.io_volumesnapshotcontents.yaml \
                     snapshot.storage.k8s.io_volumesnapshots.yaml; do
            kubectl apply -f "$base/$crd"
          done

      - name: Install the driver CRDs
        run: kubectl apply -f deploy/crds/

      # A server-side dry run of a namespaced object still resolves its
      # namespace, so the namespace has to exist for real even though nothing
      # else will.
      - name: Create the namespace
        run: kubectl create namespace truenas-csi

      # A server-side dry run validates every rendered object against the API
      # server without creating anything. The driver cannot become healthy here
      # -- there is no appliance -- so readiness is deliberately not asserted.
      - name: Render and validate against the API server
        run: |
          helm template truenas-csi deploy/helm/truenas-csi \
            --namespace truenas-csi \
            --set backends.nas1.endpoint=wss://nas.example.com/api/current \
            --set backends.nas1.username=truenas_admin \
            --set backends.nas1.apiKey=not-a-real-key \
            --set backends.nas1.pool=tank \
            --set backends.nas1.parentDataset=k8s \
            --set fencing.enabled=true \
            --set podmon.enabled=true \
            --set metrics.enabled=true \
          | kubectl apply --namespace truenas-csi --dry-run=server -f -

      - name: Render the defaults too
        run: |
          helm template truenas-csi deploy/helm/truenas-csi \
            --namespace truenas-csi \
            --set backends.nas1.endpoint=wss://nas.example.com/api/current \
            --set backends.nas1.username=truenas_admin \
            --set backends.nas1.apiKey=not-a-real-key \
            --set backends.nas1.pool=tank \
            --set backends.nas1.parentDataset=k8s \
          | kubectl apply --namespace truenas-csi --dry-run=server -f -

  # A release builds a multi-arch image; catching a broken Dockerfile here is
  # cheaper than catching it while cutting a tag. Nothing is pushed.
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
