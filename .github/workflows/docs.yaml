name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "deploy/helm/**"
  workflow_dispatch:

# A superseded docs build is wasted machine time, but a deploy is not cancelled
# midway: concurrency is scoped to the build and the deploy waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install --no-cache-dir mkdocs-material==9.5.44

      # --strict turns a broken internal link into a failed build. A docs site
      # that silently 404s is worse than one that refuses to publish.
      - name: Build
        run: mkdocs build --strict

      # The chart is published from the same Pages site, so `helm repo add` and
      # the documentation share one URL.
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # The index is built from the RELEASES, not from the working tree.
      #
      # Packaging the checked-out chart published main's in-development chart
      # under whatever version Chart.yaml happened to carry -- which, between
      # releases, is the version already released. `helm install --version
      # 0.1.3` from the documented repository then installed unreleased code:
      # the served 0.1.3 and the v0.1.3 release asset had different digests.
      #
      # And because a Pages artifact replaces the whole site, re-indexing one
      # freshly packaged chart erased every earlier version from the index, so
      # no released version could be installed except the newest.
      #
      # Taking the tarballs from the releases fixes both: every released
      # version is listed, and each is byte-for-byte the artifact its tag
      # published. The index is rebuilt from scratch each time, which is safe
      # precisely because the releases, not this workflow, are the source of
      # truth.
      - name: Publish the released charts into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/charts
          tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            gh release download "$tag" --pattern 'truenas-csi-*.tgz' \
              --dir site/charts --clobber || true
          done
          if ! ls site/charts/*.tgz >/dev/null 2>&1; then
            # A repository with no releases yet still gets its documentation;
            # it simply has no chart to serve, and saying so beats an empty
            # index that looks like a broken repository.
            echo "::warning::no released chart tarballs found; the Helm repository index is not published"
            rm -rf site/charts
            exit 0
          fi
          helm repo index site/charts \
            --url https://piwi3910.github.io/truenas-csi/charts
          echo "published chart versions:"
          helm show chart site/charts/*.tgz >/dev/null 2>&1 || true
          ls -1 site/charts/*.tgz

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
