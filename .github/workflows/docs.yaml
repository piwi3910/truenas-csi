name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "deploy/helm/**"
  workflow_dispatch:

# A superseded docs build is wasted machine time, but a deploy is not cancelled
# midway: concurrency is scoped to the build and the deploy waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install --no-cache-dir mkdocs-material==9.5.44

      # --strict turns a broken internal link into a failed build. A docs site
      # that silently 404s is worse than one that refuses to publish.
      - name: Build
        run: mkdocs build --strict

      # The chart is published from the same Pages site, so `helm repo add` and
      # the documentation share one URL. Packaging here rather than in the
      # release workflow keeps the index in step with what is actually served.
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package the chart into the site
        run: |
          mkdir -p site/charts
          helm package deploy/helm/truenas-csi --destination site/charts
          helm repo index site/charts \
            --url https://piwi3910.github.io/truenas-csi/charts

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
