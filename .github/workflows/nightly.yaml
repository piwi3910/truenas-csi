# Publish a testable image from main, between version tags.
#
# release.yaml only publishes on a v* tag, and ci.yaml builds without pushing,
# so there was no image for any commit on main. That left a cluster with no way
# to run what main actually contains: the fixes sat unreleased and untested on
# real hardware until somebody decided to cut a version.
#
# This fills exactly that gap and nothing more. It is NOT a release: it is not
# signed, it carries no SBOM attestation, it never moves `latest`, and its tags
# say `nightly` so nothing can mistake one for a version.
name: nightly

on:
  schedule:
    # 02:30 UTC. Off the hour because the hour is when everybody else's cron
    # runs and GitHub's shared runners queue behind it.
    - cron: "30 2 * * *"
  workflow_dispatch:

# One nightly at a time, and never cancelled: a half-pushed manifest list is
# worse than a queued run. Matches release.yaml for the same reason.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: piwi3910/truenas-csi
  GO_VERSION: "1.27"

jobs:
  # The same gate release.yaml applies. A nightly is for testing, which is
  # exactly why it must not publish something that would have failed a pull
  # request: a broken nightly costs a day of somebody chasing a bug that is not
  # in the driver.
  verify:
    name: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

  # Each architecture on its own native runner, pushed by digest only, so no tag
  # moves until both digests exist and the manifest list is assembled.
  build:
    name: build (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          # VERSION is the commit, not a version number. `truenas-csi -version`
          # on a nightly then names the exact source it was built from, which is
          # the only question worth asking of a build that has no version.
          build-args: |
            VERSION=nightly-${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=nightly-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.arch }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, deliberately. `nightly` is what a test cluster follows and it
      # moves; `nightly-<sha>` never moves, so a run that found a bug can be
      # pinned, and two clusters can be told apart when one has not pulled yet.
      - name: Create manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # each digest must be a separate argument
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:nightly" \
            -t "${REGISTRY}/${IMAGE_NAME}:nightly-${SHA}" \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:nightly-${SHA}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}

      # The check that would have caught a real incident: an image built for one
      # architecture is invisible until every pod on the cluster reports
      # "exec format error".
      - name: Assert the manifest list covers both architectures
        run: |
          set -euo pipefail
          platforms=$(docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown")
                     | .platform.os + "/" + .platform.architecture' \
            | sort -u)
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$want" || { echo "manifest list is missing $want" >&2; exit 1; }
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "### nightly"
            echo
            echo "\`${REGISTRY}/${IMAGE_NAME}:nightly-${SHA}\`"
            echo
            echo "Also tagged \`nightly\`. Digest \`${DIGEST}\`."
            echo
            echo "Not a release: unsigned, no SBOM attestation, \`latest\` untouched."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          SHA: ${{ github.sha }}
